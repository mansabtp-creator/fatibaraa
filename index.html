<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>FATIBARA — console admin (version professionnelle)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff6600;--od:#e85d04;--ink:#111214;--mut:#6b6f76;--line:#e7e4df;--bg:#f6f5f3;--card:#fff;--ok:#12805c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden;max-width:100%}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100%;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;min-height:100vh}
aside{display:none;width:268px;flex-shrink:0;flex-direction:column;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.brand{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.brand img{height:30px;width:auto}
.brand span{display:block;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--od)}
nav{flex:1;padding:6px 12px 16px;overflow:auto}
.grp{padding:16px 12px 6px;font-size:10px;font-weight:700;letter-spacing:.18em;color:#9a9ea5;text-transform:uppercase}
.it{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:8px;color:#4a4d54;font-weight:600;font-size:13.5px;text-align:left;margin-bottom:1px;transition:background .15s,color .15s}
.it svg{font-size:19px;color:#8a8e95}
.it:hover{background:var(--bg);color:var(--ink)}
.it[aria-current=true]{background:#fff4ec;color:var(--ink)}
.it[aria-current=true]:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--o)}
.it[aria-current=true] svg{color:var(--o)}
.it .bd{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--o);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:20;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bl{display:flex;align-items:center;gap:10px;min-width:0}
.burger{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:22px}.burger:hover{background:var(--bg)}
.crumb{font-size:12px;color:var(--mut);white-space:nowrap}.crumb b{color:var(--od);font-weight:600}
.bar h1{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{display:none;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-left:18px;min-width:300px;transition:border-color .2s,box-shadow .2s}
.srch:focus-within{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,102,0,.12);background:#fff}
.srch svg{font-size:16px;color:#9a9ea5}.srch input{border:0;outline:0;background:none;font:inherit;font-size:13px;width:100%;color:var(--ink)}
.br{display:flex;align-items:center;gap:8px}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:#55585f}.ico:hover{background:var(--bg)}
.prof{position:relative}
.me{display:flex;align-items:center;gap:10px;border-radius:999px;padding:3px 6px 3px 3px}
.me p{display:none;text-align:right;font-size:13px;font-weight:600;line-height:1.25}.me small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.chev{display:none;font-size:16px;color:#9a9ea5;transition:transform .2s}.me[aria-expanded=true] .chev{transform:rotate(180deg)}
.pm{position:absolute;right:0;top:calc(100% + 10px);width:244px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 50px -20px rgba(17,18,20,.35);padding:6px;display:none;z-index:40}
.pm.on{display:block}.pmh{padding:10px 12px;border-bottom:1px solid #f1eeea;margin-bottom:6px}.pmh b{display:block;font-size:13px}.pmh span{font-size:11px;color:var(--mut)}
.pm button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;text-align:left}
.pm button:hover{background:var(--bg)}.pm button svg{font-size:18px;color:#8a8e95}.pm .dg,.pm .dg svg{color:#c0391b}.pm .dg:hover{background:#fdeeea}
.pad{padding:20px 16px 44px;max-width:1500px;width:100%;margin:0 auto}
.hello{margin-bottom:18px}.hello h2{font-size:22px;font-weight:800;letter-spacing:-.02em}.hello p{font-size:13px;color:var(--mut);margin-top:2px}
.sums{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s,border-color .2s}
.k:hover{border-color:#d9d5cf;box-shadow:0 10px 28px -18px rgba(17,18,20,.3)}
.k .top{display:flex;align-items:center;justify-content:space-between;gap:8px}.k h3{font-size:12.5px;font-weight:600;color:var(--mut)}
.k .ic{width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:18px;color:#55585f}
.k .v{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}.k .v small{font-size:12px;font-weight:600;color:var(--mut);margin-left:4px;letter-spacing:0}
.k.hot{background:var(--ink);border-color:var(--ink);color:#fff}.k.hot h3{color:rgba(255,255,255,.65)}.k.hot .ic{background:rgba(255,255,255,.1);color:var(--o)}.k.hot .v{font-size:30px}.k.hot .v em{font-style:normal;color:var(--o)}.k.hot .v small{color:rgba(255,255,255,.6)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel>h3{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px}.panel>.sub{font-size:12px;color:var(--mut);margin-bottom:14px}
.todo{display:grid;grid-template-columns:1fr;gap:8px}
.td{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;text-align:left;transition:border-color .2s,background .2s}
.td:hover{border-color:var(--o);background:#fffaf6}
.td .ic{width:38px;height:38px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:19px;color:#55585f;flex-shrink:0}
.td:hover .ic{background:#fff4ec;color:var(--o)}
.td b{display:block;font-size:14px;font-weight:600}.td span{font-size:12px;color:var(--mut)}
.td em{margin-left:auto;font-style:normal;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.td em.on{color:var(--o)}
.td .ch{font-size:16px;color:#c3beb7;margin-left:4px}
.empty{padding:50px 20px;text-align:center;color:var(--mut);font-size:13.5px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.drawer{position:fixed;inset:0;z-index:60;display:none}.drawer.on{display:block}
.drawer .sh{position:absolute;inset:0;background:rgba(14,14,16,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.drawer .pn{position:absolute;left:0;top:0;bottom:0;width:290px;max-width:86vw;background:#fff;display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.note{text-align:center;color:var(--mut);font-size:12px;padding:6px 16px 30px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;transition:.25s;pointer-events:none;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:768px){aside{display:flex}.burger{display:none}.bar{min-height:72px;padding:0 32px}.me p{display:block}.chev{display:block}.pad{padding:28px 32px 52px}.hello h2{font-size:26px}
  .sums{grid-template-columns:1.4fr 1fr}.kpis{grid-template-columns:repeat(4,1fr);gap:14px}.sums{gap:14px;margin-bottom:14px}.kpis{margin-bottom:14px}.todo{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1180px){.srch{display:flex}}
@media(prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>
